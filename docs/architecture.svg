<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#232F3E"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8998"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="24" font-weight="700" fill="#232F3E">Scalable Web Application on AWS: ALB, Auto Scaling, CloudFront, RDS Multi-AZ</text>

  <!-- region -->
  <rect x="470" y="70" width="1100" height="900" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="470" y="70" width="210" height="30" fill="#00A4A6"/>
  <text x="482" y="91" font-size="15" font-weight="700" fill="#FFFFFF">Region eu-west-3 (Paris)</text>

  <!-- VPC -->
  <rect x="500" y="115" width="770" height="835" fill="#F8F5FF" stroke="#8C4FFF" stroke-width="2"/>
  <rect x="500" y="115" width="190" height="28" fill="#8C4FFF"/>
  <text x="512" y="135" font-size="14" font-weight="700" fill="#FFFFFF">VPC 10.0.0.0/16</text>

  <!-- AZ columns -->
  <rect x="530" y="155" width="355" height="780" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="545" y="177" font-size="14" font-weight="700" fill="#147EBA">Availability Zone A</text>
  <rect x="900" y="155" width="355" height="780" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="915" y="177" font-size="14" font-weight="700" fill="#147EBA">Availability Zone B</text>

  <!-- subnet rows -->
  <rect x="540" y="190" width="335" height="180" fill="#E9F3E6" stroke="#7AA116"/>
  <text x="550" y="208" font-size="12" fill="#3F6A12">Public subnet 10.0.0.0/24</text>
  <rect x="910" y="190" width="335" height="180" fill="#E9F3E6" stroke="#7AA116"/>
  <text x="920" y="208" font-size="12" fill="#3F6A12">Public subnet 10.0.1.0/24</text>

  <rect x="540" y="400" width="335" height="250" fill="#E6F0F8" stroke="#147EBA"/>
  <text x="550" y="418" font-size="12" fill="#0E5A87">Private app subnet 10.0.10.0/24</text>
  <rect x="910" y="400" width="335" height="250" fill="#E6F0F8" stroke="#147EBA"/>
  <text x="920" y="418" font-size="12" fill="#0E5A87">Private app subnet 10.0.11.0/24</text>

  <rect x="540" y="690" width="335" height="230" fill="#F3E8F7" stroke="#C925D1"/>
  <text x="550" y="708" font-size="12" fill="#8A1A90">Private DB subnet 10.0.20.0/24 (no internet route)</text>
  <rect x="910" y="690" width="335" height="230" fill="#F3E8F7" stroke="#C925D1"/>
  <text x="920" y="708" font-size="12" fill="#8A1A90">Private DB subnet 10.0.21.0/24</text>

  <!-- internet gateway on the VPC edge -->
  <rect x="482" y="250" width="36" height="36" rx="4" fill="#8C4FFF"/>
  <text x="500" y="274" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">IGW</text>

  <!-- ALB + WAF -->
  <rect x="600" y="228" width="580" height="62" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <rect x="612" y="240" width="38" height="38" rx="4" fill="#8C4FFF"/>
  <text x="631" y="264" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALB</text>
  <text x="662" y="256" font-size="15" font-weight="700" fill="#232F3E">Application Load Balancer</text>
  <text x="662" y="276" font-size="12" fill="#545B64">listener rules: /api/*, web · 403 without the CloudFront header · access logs</text>
  <rect x="1120" y="212" width="78" height="34" rx="4" fill="#DD344C"/>
  <text x="1159" y="234" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWS WAF</text>

  <!-- NAT gateways -->
  <rect x="560" y="310" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="635" y="337" font-size="13" fill="#232F3E" text-anchor="middle">NAT Gateway A</text>
  <rect x="930" y="310" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="1005" y="337" font-size="13" fill="#232F3E" text-anchor="middle">NAT Gateway B</text>

  <!-- ASG -->
  <rect x="560" y="440" width="665" height="190" rx="8" fill="none" stroke="#ED7100" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="575" y="460" font-size="13" font-weight="700" fill="#B35600">Auto Scaling group · min 2 · max 6 · target tracking (CPU 50 %) + step scaling (requests)</text>
  <g font-size="12" fill="#232F3E">
    <rect x="580" y="480" width="125" height="120" rx="6" fill="#FFFFFF" stroke="#ED7100"/>
    <rect x="623" y="492" width="38" height="38" rx="4" fill="#ED7100"/>
    <text x="642" y="516" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EC2</text>
    <text x="642" y="552" text-anchor="middle">Flask app</text>
    <text x="642" y="570" text-anchor="middle">:8080 · IMDSv2</text>
    <text x="642" y="588" text-anchor="middle">CW agent</text>

    <rect x="725" y="480" width="125" height="120" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-dasharray="4 3"/>
    <rect x="768" y="492" width="38" height="38" rx="4" fill="#F5B67A"/>
    <text x="787" y="516" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EC2</text>
    <text x="787" y="560" text-anchor="middle">added when</text>
    <text x="787" y="578" text-anchor="middle">load rises</text>

    <rect x="950" y="480" width="125" height="120" rx="6" fill="#FFFFFF" stroke="#ED7100"/>
    <rect x="993" y="492" width="38" height="38" rx="4" fill="#ED7100"/>
    <text x="1012" y="516" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EC2</text>
    <text x="1012" y="552" text-anchor="middle">Flask app</text>
    <text x="1012" y="570" text-anchor="middle">:8080 · IMDSv2</text>
    <text x="1012" y="588" text-anchor="middle">CW agent</text>

    <rect x="1095" y="480" width="115" height="120" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-dasharray="4 3"/>
    <rect x="1133" y="492" width="38" height="38" rx="4" fill="#F5B67A"/>
    <text x="1152" y="516" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EC2</text>
    <text x="1152" y="560" text-anchor="middle">added when</text>
    <text x="1152" y="578" text-anchor="middle">load rises</text>
  </g>

  <!-- RDS -->
  <rect x="580" y="740" width="255" height="120" rx="8" fill="#FFFFFF" stroke="#C925D1" stroke-width="2"/>
  <rect x="595" y="755" width="40" height="40" rx="4" fill="#C925D1"/>
  <text x="615" y="780" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RDS</text>
  <text x="647" y="772" font-size="15" font-weight="700" fill="#232F3E">PostgreSQL primary</text>
  <text x="647" y="792" font-size="12" fill="#545B64">encrypted · TLS only</text>
  <text x="595" y="830" font-size="12" fill="#545B64">backups 7 days · logs to CloudWatch</text>

  <rect x="950" y="740" width="255" height="120" rx="8" fill="#FFFFFF" stroke="#C925D1" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="965" y="755" width="40" height="40" rx="4" fill="#E79BEB"/>
  <text x="985" y="780" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RDS</text>
  <text x="1017" y="772" font-size="15" font-weight="700" fill="#232F3E">Standby (Multi-AZ)</text>
  <text x="1017" y="792" font-size="12" fill="#545B64">automatic failover</text>
  <text x="965" y="830" font-size="12" fill="#545B64">same endpoint after failover</text>

  <line x1="835" y1="800" x2="948" y2="800" stroke="#C925D1" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="892" y="784" font-size="11" fill="#8A1A90" text-anchor="middle">synchronous</text>
  <text x="892" y="824" font-size="11" fill="#8A1A90" text-anchor="middle">replication</text>

  <!-- outside: users, Route 53, CloudFront, S3 -->
  <rect x="40" y="420" width="150" height="90" rx="10" fill="#F2F3F3" stroke="#232F3E"/>
  <text x="115" y="458" font-size="16" font-weight="700" fill="#232F3E" text-anchor="middle">Users</text>
  <text x="115" y="480" font-size="12" fill="#545B64" text-anchor="middle">browser, HTTPS</text>

  <rect x="40" y="180" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <rect x="52" y="192" width="38" height="38" rx="4" fill="#8C4FFF"/>
  <text x="71" y="216" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">R53</text>
  <text x="100" y="208" font-size="14" font-weight="700" fill="#232F3E">Route 53</text>
  <text x="100" y="226" font-size="11" fill="#545B64">alias records</text>
  <text x="52" y="256" font-size="11" fill="#545B64">health check on /health</text>

  <rect x="250" y="410" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <rect x="262" y="422" width="38" height="38" rx="4" fill="#8C4FFF"/>
  <text x="281" y="446" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CF</text>
  <text x="310" y="438" font-size="14" font-weight="700" fill="#232F3E">CloudFront</text>
  <text x="310" y="456" font-size="11" fill="#545B64">TLS, HTTP/3</text>
  <text x="262" y="486" font-size="11" fill="#545B64">pages: not cached</text>
  <text x="262" y="504" font-size="11" fill="#545B64">/static/*: cached at edge</text>

  <rect x="250" y="690" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
  <rect x="262" y="702" width="38" height="38" rx="4" fill="#7AA116"/>
  <text x="281" y="726" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">S3</text>
  <text x="310" y="718" font-size="14" font-weight="700" fill="#232F3E">S3 static</text>
  <text x="310" y="736" font-size="11" fill="#545B64">private bucket</text>
  <text x="262" y="770" font-size="11" fill="#545B64">read only by CloudFront (OAC)</text>

  <!-- right column: managed services -->
  <g font-size="12">
    <rect x="1300" y="150" width="245" height="78" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="2"/>
    <rect x="1312" y="162" width="38" height="38" rx="4" fill="#DD344C"/>
    <text x="1331" y="186" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SM</text>
    <text x="1360" y="180" font-size="14" font-weight="700" fill="#232F3E">Secrets Manager</text>
    <text x="1360" y="198" fill="#545B64">DB password, made by RDS</text>
    <text x="1312" y="218" fill="#545B64">instance role reads this one only</text>

    <rect x="1300" y="260" width="245" height="78" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="2"/>
    <rect x="1312" y="272" width="38" height="38" rx="4" fill="#E7157B"/>
    <text x="1331" y="296" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SSM</text>
    <text x="1360" y="290" font-size="14" font-weight="700" fill="#232F3E">Systems Manager</text>
    <text x="1360" y="308" fill="#545B64">Session Manager shell</text>
    <text x="1312" y="328" fill="#545B64">no SSH key, no port 22, no bastion</text>

    <rect x="1300" y="400" width="245" height="120" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="2"/>
    <rect x="1312" y="412" width="38" height="38" rx="4" fill="#E7157B"/>
    <text x="1331" y="436" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CW</text>
    <text x="1360" y="430" font-size="14" font-weight="700" fill="#232F3E">CloudWatch</text>
    <text x="1360" y="448" fill="#545B64">dashboard, 10 alarms</text>
    <text x="1312" y="474" fill="#545B64">metrics: ALB, ASG, EC2, RDS, WAF</text>
    <text x="1312" y="492" fill="#545B64">logs: app, WAF, VPC Flow Logs, RDS</text>
    <text x="1312" y="510" fill="#545B64">memory and disk from the agent</text>

    <rect x="1300" y="560" width="245" height="78" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="2"/>
    <rect x="1312" y="572" width="38" height="38" rx="4" fill="#E7157B"/>
    <text x="1331" y="596" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SNS</text>
    <text x="1360" y="590" font-size="14" font-weight="700" fill="#232F3E">SNS topic</text>
    <text x="1360" y="608" fill="#545B64">alarm and recovery emails</text>
    <text x="1312" y="628" fill="#545B64">→ on-call email</text>

    <rect x="1300" y="680" width="245" height="78" rx="8" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
    <rect x="1312" y="692" width="38" height="38" rx="4" fill="#7AA116"/>
    <text x="1331" y="716" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">S3</text>
    <text x="1360" y="710" font-size="14" font-weight="700" fill="#232F3E">ALB access logs</text>
    <text x="1360" y="728" fill="#545B64">expire after 90 days</text>
  </g>

  <!-- request path (dark arrows) -->
  <g stroke="#232F3E" stroke-width="2.2" fill="none" marker-end="url(#a)">
    <path d="M115 420 V272"/>
    <path d="M190 465 H248"/>
    <path d="M345 520 V688"/>
    <path d="M440 445 H470 V268 H480"/>
    <path d="M518 268 H598"/>
    <path d="M760 290 V478"/>
    <path d="M1060 290 V478"/>
    <path d="M642 600 V738"/>
    <path d="M1012 600 V650 H760 V738"/>
  </g>
  <g font-size="12" fill="#232F3E">
    <text x="125" y="350">DNS</text>
    <text x="196" y="455">HTTPS</text>
    <text x="352" y="610">/static/*</text>
    <text x="352" y="626">OAC</text>
    <text x="303" y="398">+ secret header</text>
    <text x="770" y="390">:8080</text>
    <text x="1070" y="390">:8080</text>
    <text x="650" y="680">:5432 TLS</text>
  </g>

  <!-- management paths (grey dashed) -->
  <g stroke="#7D8998" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#g)">
    <path d="M1225 510 H1270 V190 H1298"/>
    <path d="M1298 300 H1280 V545 H1227"/>
    <path d="M1227 470 H1298"/>
    <path d="M1422 520 V558"/>
    <path d="M1180 290 V375 H1288 V718 H1298"/>
    <path d="M642 480 V380 H700 V356"/>
  </g>
  <g font-size="11" fill="#545B64">
    <text x="1235" y="182">read secret</text>
    <text x="1233" y="560">sessions</text>
    <text x="1232" y="462">metrics, logs</text>
    <text x="1196" y="370">logs</text>
    <text x="648" y="374">outbound via NAT</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#232F3E">
    <line x1="40" y1="900" x2="90" y2="900" stroke="#232F3E" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="100" y="904">user request path</text>
    <line x1="40" y1="930" x2="90" y2="930" stroke="#7D8998" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#g)"/>
    <text x="100" y="934">management, logs, secrets</text>
    <text x="40" y="958" fill="#545B64">Security groups chain the tiers:</text>
    <text x="40" y="974" fill="#545B64">CloudFront → ALB → app → DB. NACLs per tier.</text>
    <text x="40" y="990" fill="#545B64">All compute in private subnets.</text>
  </g>
</svg>
